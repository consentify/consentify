name: e2e

# Disabled 16. 11. 2026: checks run locally (hooks, pnpm verify), GitHub CI stays light.
on:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - run: pnpm --filter @consentify/core build

      - run: npx playwright install --with-deps chromium

      - run: pnpm e2e
