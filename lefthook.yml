pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

# react's tsc and tests read core/dist, so build it before they run side by side.
pre-push:
  # lefthook skips a pre-push job when the push changes no file it can list (a push that only deletes files).
  # A job that names {files} is checked against this list instead, so it always runs.
  files: git ls-files -- package.json
  jobs:
    - name: build core
      run: "pnpm --filter @consentify/core build  # {files}"
    - group:
        parallel: true
        jobs:
          - name: typecheck
            run: "pnpm -r check  # {files}"
          - name: test
            run: "pnpm test  # {files}"
